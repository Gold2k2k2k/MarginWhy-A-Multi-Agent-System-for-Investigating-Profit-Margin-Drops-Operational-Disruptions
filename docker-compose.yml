services:
  marginwhy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marginwhy-platform
    ports:
      - "8000:8000"
    environment:
      - SAMPLE_MODE=true
      - PORT=8000
      - NVIDIA_MODEL_NAME=nvidia/nemotron-3-super-120b-a12b
      - METERLESS_BASE_URL=http://localhost:11434/v1
      - ZETARIS_REST_URL=http://localhost:8888/api/v1.0
      - ZETARIS_BASE_URL=http://localhost:3000
      - ZETARIS_ORG_ID=1
      - ZETARIS_TIMEOUT_SEC=30
    env_file:
      - path: .env
        required: false
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
